<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b2a1a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Champi · connexion</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: #3b2a1a; color: #2b2118; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      form { width: 100%; max-width: 340px; background: #fffdf9; border-radius: 16px; padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px #0005; }
      img { width: 64px; height: 64px; border-radius: 14px; align-self: center; }
      h1 { margin: 0; font-size: 1.3rem; text-align: center; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: #7b6f63; }
      input { font: inherit; font-size: 16px; padding: 0.7rem 0.8rem; border: 1px solid #e6ddd0; border-radius: 12px; }
      input:focus { outline: 2px solid #7a4b1e; outline-offset: 1px; }
      button { font: inherit; font-weight: 600; color: #fff; background: #7a4b1e; border: 0; border-radius: 999px; padding: 0.75rem; cursor: pointer; }
      .error { margin: 0; color: #b91c1c; font-size: 0.88rem; text-align: center; }
    </style>
  </head>
  <body>
    <form method="post" action="/api/login">
      <img src="/icon-192.png" alt="" />
      <h1>Champi</h1>
      <p class="error" id="erreur" hidden>Mot de passe incorrect.</p>
      <label>
        Mot de passe
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      </label>
      <button type="submit">Entrer</button>
    </form>
    <script>
      if (new URLSearchParams(location.search).has('erreur')) document.getElementById('erreur').hidden = false;
    </script>
  </body>
</html>
